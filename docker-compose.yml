services:
  mysql:
    image: mysql:8.0
    container_name: expenseflow-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: Nitin123
      MYSQL_DATABASE: expense_manager
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pNitin123"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: expenseflow-backend
    restart: always
    environment:
      DATABASE_URL: mysql+pymysql://root:Nitin123@mysql:3306/expense_manager
      SECRET_KEY: qwerty123456
      ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8000
    container_name: expenseflow-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mysql_data:
